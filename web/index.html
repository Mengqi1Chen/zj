<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APX-240 · 故障诊断工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#183246;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{background:linear-gradient(125deg,#102f42,#0a5962);color:white;padding:34px max(24px,calc((100vw - 1240px)/2));box-shadow:0 4px 18px #13344822}header p{color:#c9dde3;margin:7px 0 0}main{max-width:1240px;margin:26px auto;padding:0 20px;display:grid;grid-template-columns:390px 1fr;gap:24px;align-items:start}section{background:white;border:1px solid #dce4e9;border-radius:14px;padding:24px;margin-bottom:18px;box-shadow:0 5px 18px #1635480a}h1{font-size:28px;margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:24px 0 9px;color:#21475c}label{font-weight:650;display:block;margin:8px 0 6px}textarea,select,input{width:100%;padding:11px 12px;border:1px solid #b9c7d0;border-radius:8px;font:inherit;background:#fff}textarea{height:150px;resize:vertical}select{margin:10px 0 4px}button{border:0;border-radius:8px;padding:11px 16px;background:#08747a;color:white;cursor:pointer;margin:7px 6px 7px 0;font:inherit;font-weight:620}button:hover{background:#075f65}button:disabled{opacity:.48;cursor:not-allowed}small,.muted{color:#667b89}.status{padding:15px 16px;border-radius:9px;background:#fff3cb;font-weight:700;border:1px solid #f2df9c}.blocked{background:#ffe7e4;color:#962b27;border-color:#f4c8c3}.pipeline{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0 16px}.next-question{padding:16px;border:1px solid #87c9c5;background:#edf9f8;border-radius:10px;margin:16px 0}.next-question strong{display:block;color:#075f65;font-size:16px}.change{padding:8px 12px;background:#eef3f6;border-radius:7px;margin:6px 0}.cause{padding:13px 14px;border:1px solid #dbe5e9;border-radius:9px;margin:9px 0}.cause.priority{border-left:5px solid #e08a19;background:#fffaf1}.cause.unsupported{opacity:.72;background:#f5f6f7}.cause p{margin:5px 0}.item{padding:10px 0;border-bottom:1px solid #edf1f3;overflow-wrap:anywhere}.evidence{border-left:4px solid #119391;padding:11px 15px;margin:12px 0;background:#f2f9f9;border-radius:0 8px 8px 0}.evidence a{display:inline-block;margin-top:8px;color:#08747a;font-weight:650}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.form-grid label{font-size:13px;margin-bottom:2px}.form-grid .wide{grid-column:1/-1}.hazards{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin:8px 0 12px}.hazards label{font-weight:400;font-size:13px;display:flex;align-items:center;gap:7px}.hazards input{width:auto}.badge{display:inline-block;background:#dcefee;color:#14575b;border-radius:20px;padding:2px 9px;margin-right:5px;font-size:12px;font-weight:700}.candidate{background:#fff0cc;color:#805b00}ol{padding-left:22px}li{margin-bottom:10px}details{margin-top:14px}summary{cursor:pointer;color:#456477}@media(max-width:850px){main{grid-template-columns:1fr}header{padding:26px 20px}.form-grid{grid-template-columns:1fr}}
</style>
<header><small style="color:#8bd8cd">EQUIPMENT MAINTENANCE ASSISTANT</small><h1>APX-240 故障诊断工作台</h1><p>基于设备说明书、报警规则与维修记录，协助现场人员完成安全诊断和处置记录</p></header>
<main><div><section><h2>新建现场诊断</h2><div class="form-grid"><div><label for="equipment-id">设备编号</label><input id="equipment-id" maxlength="80" placeholder="如 APX240-01"></div><div><label for="production-line">产线/工位</label><input id="production-line" maxlength="80" placeholder="如 包装一线"></div><div><label for="alarm-code">报警码</label><input id="alarm-code" maxlength="20" placeholder="如 A203"></div><div><label for="stage">发生阶段</label><input id="stage" maxlength="80" placeholder="如 预热、生产中"></div><div><label for="fault-time">故障时间</label><input id="fault-time" maxlength="60" placeholder="如 14:20"></div><div><label for="reporter">报告人</label><input id="reporter" maxlength="80"></div></div><label for="input">故障现象、读数与已执行操作</label><textarea id="input" placeholder="例如：设定165°C，实际128°C，加热电流0A；已完成预热。"></textarea><label>现场危险现象</label><div class="hazards" id="hazards"><label><input type="checkbox" value="烟雾">烟雾</label><label><input type="checkbox" value="焦味">焦味</label><label><input type="checkbox" value="异常高温">异常高温</label><label><input type="checkbox" value="剧烈振动">剧烈振动</label><label><input type="checkbox" value="金属摩擦">金属摩擦声</label><label><input type="checkbox" value="部件松脱">部件松脱</label><label><input type="checkbox" value="火花">火花/起火迹象</label></div><button id="run">开始诊断</button><p id="error" role="alert"></p><small>未勾选不代表已经确认无危险。涉及拆装、线路、加热、气路或安全联锁时，请遵守停机隔离和授权要求。</small></section><section><h2>当前会话</h2><p>可以持续补充现场信息或更正读数，系统会保留诊断版本和安全状态。</p><small>新建会话用于记录另一项故障，不代表已批准当前设备复机。</small></section></div>
<div><section id="result" aria-live="polite"><h2>等待现场信息</h2><p class="muted">提交故障描述后，这里将显示风险状态、可能原因、证据来源、排查顺序、待补信息和专家升级建议。</p></section></div></main>
<script>
const samples=[];
const $=id=>document.getElementById(id);let last,session,pending,recovering=true,recoveryFailed=false,serviceReady=false,reviewPending=null,reviewBusy=false,currentReview=null,reviewReady=false,reviewLoadSeq=0;
function el(tag,text,parent,cls){let n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;if(parent)parent.append(n);return n}
samples.forEach(([name,text])=>{let b=el('button',name,$('samples'),'sample');b.onclick=()=>$('input').value=text});
function list(title,items,format){el('h3',title,$('result'));let l=el('ol','',$('result'));items.forEach(x=>el('li',format?format(x):x,l));if(!items.length)el('p','暂无；需要更多现场证据。',$('result'),'muted')}
function renderCauses(items){el('h3','可能原因（均未确认）',$('result'));if(!items.length)return el('p','当前证据不足，未生成原因候选。',$('result'),'muted');for(const c of items){const tier=c.assessment||'RETAINED';let d=el('div','',$('result'),'cause '+(tier==='PRIORITY'?'priority':tier==='CURRENTLY_UNSUPPORTED'?'unsupported':''));el('span',c.assessment_label||'保留候选',d,'badge '+(tier==='CURRENTLY_UNSUPPORTED'?'candidate':''));el('strong',c.description,d);el('p',c.assessment_reason||'旧版报告未记录动态分层；补充一次现场信息后将重新评估。',d);el('small',(c.evidence_level||'说明书候选')+' · '+(c.verification_status||'待现场验证')+' · 证据 '+c.evidence_ids.join(', '),d)}}
function download(data,name){let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const panel=$('run').parentElement;
const mode=el('select','',panel);mode.id='mode';mode.setAttribute('aria-label','补充方式');
[['append','补充现场信息'],['correct_measurements','更正之前的读数']].forEach(([v,t])=>{let o=el('option',t,mode);o.value=v});
const fresh=el('button','新建会话',panel);fresh.onclick=()=>{if(pending)return;try{localStorage.removeItem('apx-session');session=null;currentReview=null;reviewReady=false;$('review-state').textContent='先生成诊断报告';reviewEvents.replaceChildren();recoveryFailed=false;clearForm();$('result').replaceChildren();turns.replaceChildren();$('error').textContent='已新建独立会话。先前设备的停机和专家复核要求仍需人工处理，新会话不授权复机。';controls()}catch(e){$('error').textContent='浏览器无法保存会话状态，请检查本地存储权限后刷新。'}};
const turns=el('div','',panel);turns.id='turns';
const structuredIds=['equipment-id','production-line','alarm-code','stage','fault-time','reporter'];
function composeMessage(){let lines=[];const mapping=[['equipment-id','设备编号'],['production-line','产线/工位'],['alarm-code','报警码'],['stage','发生阶段'],['fault-time','故障时间'],['reporter','报告人']];for(const [id,label] of mapping){const value=$(id).value.trim();if(value)lines.push(label+'：'+value)}const hazards=[...document.querySelectorAll('#hazards input:checked')].map(x=>x.value);if(hazards.length)lines.push('现场确认存在：'+hazards.join('、'));const detail=$('input').value.trim();if(detail)lines.push('现场描述：'+detail);return lines.join('\n')}
function clearForm(){for(const id of structuredIds)$(id).value='';document.querySelectorAll('#hazards input').forEach(x=>x.checked=false);$('input').value=''}
document.querySelector('header small').textContent='EQUIPMENT MAINTENANCE ASSISTANT';
function controls(){const submitLocked=!!pending||(recovering&&serviceReady);const actionLocked=recovering||!serviceReady||reviewBusy||!!reviewPending;$('run').disabled=actionLocked||(recoveryFailed&&!pending);fresh.disabled=actionLocked||!!pending;for(const id of ['input',...structuredIds])$(id).disabled=submitLocked;document.querySelectorAll('#hazards input').forEach(x=>x.disabled=submitLocked);mode.disabled=submitLocked;document.querySelectorAll('.sample').forEach(b=>b.disabled=submitLocked);$('run').textContent=pending?'重试上次提交':session?'补充并更新报告':'生成诊断报告';reviewControls()}
function clearPending(){sessionStorage.removeItem('apx-pending');pending=null}
async function getSession(id){if(!/^[a-f0-9-]{36}$/.test(id))throw Error('保存的会话编号无效');const resp=await fetch('/api/sessions/'+id);const data=await resp.json();if(!resp.ok)throw Error(data.error+'；会话未恢复，请核对服务后刷新');return data}
async function restore(){const id=localStorage.getItem('apx-session');if(!id)return;session=await getSession(id);render(session.latest_report)}
$('run').onclick=async()=>{recovering=true;controls();$('error').textContent='';try{
 if(!pending){const message=composeMessage();if(!message.trim())throw Error('请先填写报警码或现场情况');pending={url:session?'/api/sessions/'+session.session_id+'/turns':'/api/sessions',body:session?{message,mode:mode.value,expected_revision:session.revision,request_id:crypto.randomUUID()}:{message,request_id:crypto.randomUUID()}}}
 sessionStorage.setItem('apx-pending',JSON.stringify(pending));
 let resp=await fetch(pending.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pending.body)});let data=await resp.json();if(!resp.ok){if(resp.status>=400&&resp.status<500){clearPending();if(resp.status===409){try{await restore()}catch(e){recoveryFailed=true;throw e}}}throw Error(data.error)};
 // A retry can return an older cached revision while another tab has advanced
 // the session. Always render the persisted latest version before unlocking.
 localStorage.setItem('apx-session',data.session_id);session=await getSession(data.session_id);clearPending();recoveryFailed=false;clearForm();render(session.latest_report);
 }catch(e){$('error').textContent=e.message+(pending?'。上次提交结果尚未确认，请重试；刷新仍保留同一请求编号。':'')}finally{recovering=false;controls()}};
function render(r){last=r;
 loadReview().catch(e=>$('review-error').textContent=e.message);
 $('run').textContent='补充并更新报告';turns.replaceChildren();el('h3','会话记录 · 第 '+session.revision+' 版',turns);session.turns.forEach(t=>el('p',t.revision+' · '+(t.mode==='correct_measurements'?'读数更正：':'')+t.message,turns));
 const statuses={SAFE_BLOCKED:'立即停机',EXPERT_REQUIRED:'停止操作，转专家',INFO_REQUIRED:'需要补充信息',REPORT_READY:'报告已生成'};
 $('result').replaceChildren();el('h2','诊断报告',$('result'));el('div',statuses[r.status]+' · '+(r.expert_required?'需要专家':'先补充信息 / 观察'),$('result'),'status '+(['SAFE_BLOCKED','EXPERT_REQUIRED'].includes(r.status)?'blocked':''));
 const meta=r.execution_metadata||{};const pipeline=el('div','',$('result'),'pipeline');const modelLabels={applied:'AI审阅：OpenAI 已应用',fallback:'AI审阅：模型结果未采用，已启用安全处理',disabled:'AI审阅：本地未配置，已启用规则处理',skipped_safety_gate:'AI审阅：安全门已先行阻断'};const retrievalLabels={embedding:'知识检索：向量检索',lexical_fallback:'知识检索：关键词检索',skipped_safety_gate:'知识检索：安全门已先行阻断'};el('span',modelLabels[meta.model_status]||'AI审阅：'+(meta.model_status||'未知'),pipeline,'badge');el('span',retrievalLabels[meta.retrieval_channel]||'知识检索：'+(meta.retrieval_channel||'未知'),pipeline,'badge');
 el('p',r.escalation_reason,$('result'));
 el('p',r.stop_policy.explanation,$('result'));if(session.safety_latch)el('p','本会话已锁定安全要求，需授权专家复核。当前版本不提供解除入口。',$('result'),'status blocked');
 if(r.change_summary?.length){el('h3','本轮诊断变化',$('result'));r.change_summary.forEach(x=>el('div',x,$('result'),'change'))}
 if(r.next_best_question?.question){let q=el('div','',$('result'),'next-question');el('small','下一步最有价值的问题',q);el('strong',r.next_best_question.question,q);el('span',r.next_best_question.reason+(r.next_best_question.remaining_count?'；另有 '+r.next_best_question.remaining_count+' 项待补信息。':''),q)}
 const labels={set_temperature:'设定温度',actual_temperature:'实际温度',heater_current:'加热电流',upstream_pressure:'上游压力',device_pressure:'设备端压力'};
 list('已提取的现场读数',Object.entries(r.current_observations.measurements).flatMap(([key,items])=>items.map(v=>labels[key]+'：'+v.value+' '+v.unit+'（原文：'+v.quote+'）')));
 list('故障现象',[r.phenomenon]);list('已知事实',r.known_facts,x=>x.text+' ['+x.source+']');renderCauses(r.possible_causes);
 list('安全前置条件',r.safety_prerequisites);list('排查顺序',r.troubleshooting_order,x=>x.action+' — '+x.executor+' ['+x.evidence_ids.join(', ')+']');list('需要补充的信息',r.missing_information);
 el('h3','证据来源',$('result'));r.evidence.forEach(e=>{let d=el('div','',$('result'),'evidence');el('span',e.authority,d,'badge '+(e.historical_only?'candidate':''));el('strong',e.source_id+' · 第 '+e.page+' 页',d);el('p',e.snippet,d);el('small',e.usage+' · '+e.filename+' · '+e.section,d);let a=el('a','打开说明书第 '+e.page+' 页',d);a.href='/manual.pdf#page='+e.page;a.target='_blank';a.rel='noopener'});
 list('历史相同点与待核对差异',r.historical_comparison,x=>x.source_id+'：'+x.same.join('；')+'。'+x.differences_or_unknown);
 el('h3','维修工单',$('result'));el('p',r.work_order.status_label+' · 指派：'+r.work_order.assigned_role,$('result'));let b=el('button','下载诊断报告',$('result'));b.onclick=()=>download(r,'fault-report.json');let w=el('button','下载维修工单',$('result'));w.onclick=()=>download(r.work_order,'work-order-draft.json');
 let all=el('button','导出完整会话',$('result'));all.onclick=()=>download(session,'session-history.json');
}
const rp=el('section','',$('result').parentElement);rp.id='review-panel';
el('h2','人工复核',rp);el('p','可登记报告复核过程和待补信息。复核记录不会自动解除停机要求或批准设备复机。',rp,'muted');
el('div','先生成诊断报告',rp).id='review-state';el('p','',rp).id='review-error';$('review-error').setAttribute('role','alert');
function field(id,label,tag='input'){el('label',label,rp).htmlFor=id;let n=el(tag,'',rp);n.id=id;n.style.width='100%';n.style.marginBottom='10px';return n}
field('review-actor','复核人员').maxLength=80;field('review-note','复核意见','textarea').maxLength=2000;field('review-questions','需要补充的信息（每行一项）','textarea');
const rb={};for(const [action,label] of [['submit','提交人工复核'],['claim','开始复核'],['request_information','退回补充信息'],['record_review','保存复核意见']]){rb[action]=el('button',label,rp);rb[action].onclick=()=>submitReview(action);rb[action].disabled=true}
const retryReview=el('button','重试复核提交',rp);retryReview.onclick=()=>submitReview();retryReview.hidden=true;
const exportReview=el('button','导出复核记录',rp);exportReview.disabled=true;exportReview.onclick=()=>download(currentReview,'review-packet.json');
const reviewEvents=el('div','',rp);
function reviewControls(){const blocked=!session||!reviewReady||recovering||!!pending||reviewBusy||!!reviewPending||!serviceReady;for(const [action,b] of Object.entries(rb)){const allowed=action==='submit'?(!currentReview||currentReview.outdated):action==='claim'?currentReview?.status==='SUBMITTED':currentReview?.status==='IN_REVIEW';b.disabled=blocked||!allowed||(action!=='submit'&&currentReview?.outdated)}retryReview.hidden=!reviewPending;retryReview.disabled=reviewBusy||!serviceReady;for(const id of ['review-actor','review-note','review-questions'])$(id).disabled=!!reviewPending||reviewBusy;exportReview.disabled=!currentReview}
async function loadReview(){if(!session){currentReview=null;return}const id=session.session_id;const seq=++reviewLoadSeq;reviewReady=false;reviewBusy=true;controls();reviewControls();try{const response=await fetch('/api/sessions/'+id+'/review');const data=await response.json();if(!response.ok)throw Error(data.error);if(session?.session_id!==id||seq!==reviewLoadSeq)return;currentReview=data;reviewReady=true;$('review-state').textContent=data?(data.work_order_projection.status_label+' · 复核第 '+data.revision+' 版 · 对应报告第 '+data.report_revision+' 版'+(data.work_order_projection.assigned_to?' · 经办：'+data.work_order_projection.assigned_to:'')+(data.outdated?' · 现场信息已更新，请重新提交复核':'')):'本报告尚未提交复核';reviewEvents.replaceChildren();if(data){data.questions.forEach(q=>el('p','待补：'+q,reviewEvents));data.events.forEach(e=>el('p',e.revision+' · '+e.actor_self_reported+'：'+e.note,reviewEvents))}}finally{if(seq===reviewLoadSeq){reviewBusy=false;controls();reviewControls()}}}
async function submitReview(action){if(reviewBusy)return;reviewBusy=true;$('review-error').textContent='';try{if(!reviewPending){if(!session||pending)throw Error('请先确认诊断提交结果');const questions=['submit','request_information'].includes(action)?$('review-questions').value.split('\n').map(s=>s.trim()).filter(Boolean):[];reviewPending={url:'/api/sessions/'+session.session_id+'/review',body:{action,actor:$('review-actor').value,note:$('review-note').value,questions,expected_revision:session.revision,expected_review_revision:currentReview?.revision||0,request_id:crypto.randomUUID()}}}sessionStorage.setItem('apx-review-pending',JSON.stringify(reviewPending));controls();reviewControls();const resp=await fetch(reviewPending.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(reviewPending.body)});const data=await resp.json();if(!resp.ok){if(resp.status>=400&&resp.status<500){reviewPending=null;sessionStorage.removeItem('apx-review-pending')}throw Error(data.error)}reviewPending=null;sessionStorage.removeItem('apx-review-pending');$('review-note').value='';if(action==='request_information')$('review-questions').value='';await restore();await loadReview()}catch(e){$('review-error').textContent=e.message+(reviewPending?'；结果未确认，请重试，沿用原请求编号。':'');if(!reviewPending)await loadReview().catch(()=>{})}finally{reviewBusy=false;controls();reviewControls()}}
async function initialize(){try{const health=await fetch('/health');const info=await health.json();if(!health.ok||info.app_version!=='0.5')throw Error('服务版本不一致，请关闭旧服务窗口并重新启动应用后刷新页面');if(info.storage_mode==='ephemeral')el('p','云端服务闲置后首次打开可能需要等待唤醒；服务重启可能清空会话，请及时导出重要记录。',document.querySelector('header'));const reviewSaved=sessionStorage.getItem('apx-review-pending');if(reviewSaved){reviewPending=JSON.parse(reviewSaved);if(!reviewPending.body?.request_id||!/^\/api\/sessions\/[a-f0-9-]{36}\/review$/.test(reviewPending.url))throw Error('未确认复核请求记录异常，请保留记录后人工核对')}const saved=sessionStorage.getItem('apx-pending');if(saved){pending=JSON.parse(saved);if(!pending.body?.request_id||!/^\/api\/sessions(?:\/[a-f0-9-]{36}\/turns)?$/.test(pending.url))throw Error('未确认请求记录格式异常；请先保留浏览器中的记录并人工核对');$('input').value=pending.body.message;mode.value=pending.body.mode||'append'}serviceReady=true;await restore();if(pending)$('error').textContent='发现上次未确认的提交。请点击重试，系统沿用同一请求编号，保留原有安全历史。'}catch(e){recoveryFailed=true;$('error').textContent=e.message}finally{recovering=false;controls();reviewControls()}}
controls();initialize();
</script></html>
